<!DOCTYPE html>
<html>
<head>
<style>
  body { background: transparent; overflow: hidden; margin:0; padding:0; }
</style>
</head>
<body>
<script>
// Get the parent document (we are same-origin with the Streamlit main page)
const parentDoc = window.parent.document;

// Check if waveCanvas already exists in parent to avoid duplicate rendering on hot reload
let canvas = parentDoc.getElementById('waveCanvas');
if (!canvas) {
  canvas = parentDoc.createElement('canvas');
  canvas.id = 'waveCanvas';
  parentDoc.body.appendChild(canvas);
}

// Apply styling to parent canvas to ensure it sits fixed at the root background
canvas.style.position = 'fixed';
canvas.style.top = '0';
canvas.style.left = '0';
canvas.style.width = '100vw';
canvas.style.height = '100vh';
canvas.style.zIndex = '-9999'; // Sit safely behind everything at the absolute root of the document
canvas.style.pointerEvents = 'none';
canvas.style.display = 'block';
canvas.style.border = 'none';

const ctx = canvas.getContext('2d');

let W = canvas.width = window.parent.innerWidth;
let H = canvas.height = window.parent.innerHeight;

// Listen to parent window resize
window.parent.addEventListener('resize', () => {
  W = canvas.width = window.parent.innerWidth;
  H = canvas.height = window.parent.innerHeight;
});

// Wave configuration
const waves = [
  { 
    color: 'rgba(180, 100, 140, 0.30)', 
    glowColor: 'rgba(200, 120, 150, 0.15)',
    amplitude: 35, frequency: 0.006, 
    speed: 0.006, offset: 0, 
    yBase: 0.38, thickness: 60 
  },
  { 
    color: 'rgba(50, 130, 180, 0.35)', 
    glowColor: 'rgba(70, 160, 200, 0.18)',
    amplitude: 30, frequency: 0.007, 
    speed: 0.009, offset: 2, 
    yBase: 0.52, thickness: 55 
  },
  { 
    color: 'rgba(130, 70, 160, 0.25)', 
    glowColor: 'rgba(150, 90, 190, 0.12)',
    amplitude: 28, frequency: 0.005, 
    speed: 0.005, offset: 4, 
    yBase: 0.64, thickness: 50 
  },
  { 
    color: 'rgba(190, 90, 90, 0.22)', 
    glowColor: 'rgba(210, 120, 100, 0.12)',
    amplitude: 25, frequency: 0.008, 
    speed: 0.008, offset: 1, 
    yBase: 0.74, thickness: 45 
  },
];

// Particles (golden bokeh dots)
const particles = [];
const PARTICLE_COUNT = 70;

for (let i = 0; i < PARTICLE_COUNT; i++) {
  particles.push({
    x: Math.random() * W,
    y: Math.random() * H,
    r: Math.random() * 1.8 + 0.3,
    opacity: Math.random() * 0.4 + 0.08,
    speed: Math.random() * 0.4 + 0.1,
    drift: (Math.random() - 0.5) * 0.3,
    pulse: Math.random() * Math.PI * 2,
    pulseSpeed: Math.random() * 0.02 + 0.005,
    color: Math.random() > 0.5 
      ? `rgba(255, 200, 100,` 
      : `rgba(255, 220, 160,`
  });
}

let time = 0;

function drawWave(wave) {
  const yBase = H * wave.yBase;
  
  // Glow pass
  ctx.save();
  ctx.filter = 'blur(10px)';
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 3) {
    const y = yBase + Math.sin(x * wave.frequency + time * wave.speed + wave.offset) * wave.amplitude
              + Math.sin(x * wave.frequency * 1.7 + time * wave.speed * 0.8 + wave.offset + 1) * (wave.amplitude * 0.35);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  ctx.fillStyle = wave.glowColor;
  ctx.fill();
  ctx.restore();
  
  // Main wave pass
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 2) {
    const y = yBase + Math.sin(x * wave.frequency + time * wave.speed + wave.offset) * wave.amplitude
              + Math.sin(x * wave.frequency * 1.7 + time * wave.speed * 0.8 + wave.offset + 1) * (wave.amplitude * 0.35)
              + Math.sin(x * wave.frequency * 0.5 + time * wave.speed * 1.2 + wave.offset + 3) * (wave.amplitude * 0.2);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.lineTo(0, H);
  ctx.closePath();
  
  // Gradient fill per wave
  const grad = ctx.createLinearGradient(0, yBase - wave.amplitude, 0, yBase + wave.thickness);
  const baseColor = wave.color.replace('rgba(', '').replace(')', '').split(',');
  grad.addColorStop(0, `rgba(${baseColor[0]},${baseColor[1]},${baseColor[2]}, 0)`);
  grad.addColorStop(0.3, wave.color);
  grad.addColorStop(1, `rgba(${baseColor[0]},${baseColor[1]},${baseColor[2]}, 0)`);
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.restore();
}

function drawParticles() {
  particles.forEach(p => {
    p.pulse += p.pulseSpeed;
    const pulseOpacity = p.opacity * (0.6 + 0.4 * Math.sin(p.pulse));
    
    // Glow
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
    const gGrad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
    gGrad.addColorStop(0, `${p.color} ${pulseOpacity * 0.5})`);
    gGrad.addColorStop(1, `${p.color} 0)`);
    ctx.fillStyle = gGrad;
    ctx.fill();
    ctx.restore();
    
    // Core dot
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `${p.color} ${pulseOpacity})`;
    ctx.fill();
    ctx.restore();
    
    // Move
    p.y -= p.speed;
    p.x += p.drift;
    if (p.y < -10) { p.y = H + 10; p.x = Math.random() * W; }
    if (p.x < -10) p.x = W + 10;
    if (p.x > W + 10) p.x = -10;
  });
}

function drawBackground() {
  // Deep space base
  const bgGrad = ctx.createLinearGradient(0, 0, W * 0.7, H);
  bgGrad.addColorStop(0, '#0f0a1a');
  bgGrad.addColorStop(0.4, '#0a0d1f');
  bgGrad.addColorStop(0.7, '#120a18');
  bgGrad.addColorStop(1, '#1a0a10');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  
  // Warm glow top right (like reference image)
  const topGlow = ctx.createRadialGradient(W * 0.85, 0, 0, W * 0.85, 0, H * 0.6);
  topGlow.addColorStop(0, 'rgba(180, 80, 50, 0.25)');
  topGlow.addColorStop(0.5, 'rgba(150, 60, 40, 0.1)');
  topGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = topGlow;
  ctx.fillRect(0, 0, W, H);
  
  // Cool glow top left
  const leftGlow = ctx.createRadialGradient(0, 0, 0, 0, 0, H * 0.5);
  leftGlow.addColorStop(0, 'rgba(40, 60, 100, 0.3)');
  leftGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = leftGlow;
  ctx.fillRect(0, 0, W, H);
  
  // Bottom light (like reference image glow at bottom)
  const bottomGlow = ctx.createRadialGradient(W * 0.5, H, 0, W * 0.5, H, H * 0.5);
  bottomGlow.addColorStop(0, 'rgba(200, 180, 220, 0.12)');
  bottomGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = bottomGlow;
  ctx.fillRect(0, 0, W, H);
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  
  // Draw waves back to front
  waves.forEach(wave => drawWave(wave));
  
  // Particles on top
  drawParticles();
  
  time++;
  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
